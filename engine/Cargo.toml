[package]
name = "packet"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
httparse = "1.10.1"
libc = "0.2.189"
maxminddb = "0.32.0"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
ts-rs = "12.0.1"
url = "2.5.8"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
